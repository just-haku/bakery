services:
  db:
    image: mysql:8.0
    container_name: bakery_mysql_dev
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bakery_db}
      MYSQL_USER: ${DB_USER:-bakery_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bakery_pass123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-bakery_root_pass123}
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - bakery_dev_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-bakery_root_pass123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bakery_web_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bakery_dev_net
    command: python manage.py runserver 0.0.0.0:8000

  gateway:
    image: nginx:alpine
    container_name: bakery_gateway_dev
    restart: unless-stopped
    ports:
      - "8008:8008"
      - "8009:8009"
      - "8010:8010"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    networks:
      - bakery_dev_net

networks:
  bakery_dev_net:
    driver: bridge
